name = "twisted"
main = ".open-next/worker.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers configuration
workers_dev = true

# Routes - custom domain configuration
routes = [
  { pattern = "twistedcustomleather.com/*", zone_name = "twistedcustomleather.com" }
]

# Assets binding for static files
[assets]
binding = "ASSETS"
directory = ".open-next/assets"

# Images binding for image optimization
[images]
binding = "IMAGES"

# Self-reference service binding for caching
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "twisted"

# D1 Database for newsletter
[[d1_databases]]
binding = "DB"
database_name = "twisted-newsletter"
database_id = "0463a12e-0924-4856-a8ba-42a0c94e8287"

[[r2_buckets]]
binding = "ORDER_ASSETS"
bucket_name = "twisted-order-assets"

# Cloudflare Flagship — feature flag binding.
# app_id will be set after provisioning the Flagship app in the dashboard.
# In local dev, the binding is remote-only and evaluateFlag() falls back to FLAG_DEFAULTS.
# [[flagship]]
# binding = "FLAGS"
# app_id = "<APP_ID>"

[vars]
SQUARE_ENVIRONMENT = "production"
SQUARE_PRODUCTION_LOCATION_ID = "KMGV4Y657Z2A5"

# Observability - Logs
[observability]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
